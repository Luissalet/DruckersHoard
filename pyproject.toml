[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drucker-hoard"
version = "0.1.0"
description = "Local engagement office: engagement files, scope comparison, proposals, deliverable review and delivery packages"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["drucker*"]

[tool.setuptools.package-data]
drucker = ["static/*"]
"drucker.hoard_link" = ["LICENSE", "VENDORED.txt", "_data/*", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
